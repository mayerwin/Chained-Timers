apply plugin: 'com.android.application'

// Android signing + publishing artifacts split between two directories:
//
//   publishing/android/                        — committed, public stuff
//     sideload.keystore                        (the public sideload key)
//     1-generate-upload-keystore.ps1, etc.     (the publishing scripts)
//     local-config.ps1                         (per-machine, gitignored)
//
//   publishing/android/secrets/                — gitignored entirely
//     upload.keystore                          (Play Store upload key)
//     keystore.properties                      (passwords for above)
//     play-service-account.json                (Play API service account)
//
// secrets/ is a `git status` no-op for everyone — anyone running the
// generators (1-generate-upload-keystore.ps1) drops the upload key here,
// and the Cloud-Console-downloaded service-account JSON also lives here.
// When secrets/ is missing (fresh checkout, CI, sideload-only flow) we
// silently skip the play signingConfig and the play-publisher plugin and
// fall back to the sideload key for release builds — so `assembleDebug`
// and the GitHub-Actions sideload pipeline keep working unchanged.
def publishingAndroidDir   = rootProject.file('../publishing/android')
def secretsDir             = new File(publishingAndroidDir, 'secrets')
def sideloadKeystoreFile   = new File(publishingAndroidDir, 'sideload.keystore')
def keystorePropertiesFile = new File(secretsDir, 'keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasPlayKey = keystoreProperties['storeFile'] != null

android {
    namespace = "com.github.chainedtimers"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.github.chainedtimers"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31
        versionName "1.4.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ------------------------------------------------------------------
    // Signing configurations. Both keystores live in publishing/android/.
    //
    // sideload — committed plaintext keystore, used for the GitHub-
    //   Releases APK and any local debug build. Anyone forking the repo
    //   gets the same key, which is intentional for sideload distribution:
    //   subsequent APK versions install in-place over each other rather
    //   than failing as "different developer".
    //
    // play — Play Store upload key. NOT committed. Generated locally by
    //   publishing/android/1-generate-upload-keystore.bat. If
    //   keystore.properties doesn't exist, this signingConfig is omitted
    //   from the build and release builds fall back to the sideload key —
    //   so the gradle project always parses cleanly even on a fresh
    //   checkout.
    // ------------------------------------------------------------------
    signingConfigs {
        sideload {
            storeFile     sideloadKeystoreFile
            storePassword 'sideload'
            keyAlias      'chainedtimers'
            keyPassword   'sideload'
            storeType     'PKCS12'
        }
        if (hasPlayKey) {
            play {
                // storeFile in keystore.properties is just a filename
                // ("upload.keystore"), interpreted relative to the
                // secrets/ directory holding the properties file.
                storeFile     new File(secretsDir, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            // Use the play upload key when it's been generated locally,
            // otherwise fall back to sideload so the gradle build still
            // succeeds in CI / fresh-checkout scenarios.
            signingConfig hasPlayKey ? signingConfigs.play : signingConfigs.sideload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // v1.4.4 — Play In-App Updates. When the app was installed from the
    // Play Store (getInstallerPackageName returns "com.android.vending"),
    // ChainTimerPlugin.checkPlayUpdate() asks the Play Store directly
    // whether a newer version is published for this specific install.
    // When it was sideloaded, the SDK returns UPDATE_NOT_AVAILABLE and
    // JS falls back to the GitHub Releases API check.
    implementation "com.google.android.play:app-update:2.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ----------------------------------------------------------------------
// gradle-play-publisher (publishing/android/4-publish-to-play.ps1).
//
// We only apply the plugin when the service-account JSON is present.
// That keeps `assembleDebug`, `bundleRelease`, the GitHub-Actions
// sideload pipeline, and any fresh-checkout build working without the
// developer ever creating a service account — it's only needed for the
// people who actually push to Play Console.
//
// The same pattern as `hasPlayKey` above for the upload keystore:
// silent fall-through when missing, never a hard error.
//
// `track` defaults to `internal` for safety. Override per invocation:
//   $env:PLAY_TRACK='production'; .\gradlew.bat publishBundle
// `releaseStatus` defaults to `completed`; flip to `draft` if you want
// the upload to land in Play Console without auto-submitting for review.
// ----------------------------------------------------------------------
def playServiceAccountFile = new File(secretsDir, 'play-service-account.json')
if (hasPlayKey && playServiceAccountFile.exists()) {
    apply plugin: 'com.github.triplet.play'

    play {
        serviceAccountCredentials.set(playServiceAccountFile)
        track.set(System.getenv('PLAY_TRACK') ?: 'internal')
        releaseStatus.set(
            com.github.triplet.gradle.androidpublisher.ReleaseStatus.valueOf(
                (System.getenv('PLAY_RELEASE_STATUS') ?: 'COMPLETED').toUpperCase()
            )
        )
        defaultToAppBundles.set(true)
        // false = upload only, don't promote across tracks. The script
        // calls `publishBundle` directly when we want a release; no need
        // for implicit cross-track behaviour.
        commit.set(true)
        // Tolerant of "version code N already published" — fail fast so
        // the script can tell the user they forgot to bump versionCode
        // instead of the request silently no-oping.
        resolutionStrategy.set(
            com.github.triplet.gradle.androidpublisher.ResolutionStrategy.FAIL
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
